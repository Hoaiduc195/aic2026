name: aic-hcmc-2026

x-common: &common
  restart: unless-stopped
  networks: [aic-internal]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    <<: *common
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aic2026}
      POSTGRES_USER: ${POSTGRES_USER:-aic2026}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *common
    image: redis:7.4-alpine
    command: [redis-server, --save, "60", "1", --appendonly, "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    <<: *common
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]

  inference:
    <<: *common
    build:
      context: .
      dockerfile: apps/inference/Dockerfile
    environment:
      AIC_INFERENCE_MODEL_FAMILY: ${AIC_INFERENCE_MODEL_FAMILY:-mock-multilingual}
      AIC_INFERENCE_MODEL_REVISION: ${AIC_INFERENCE_MODEL_REVISION:-2026-07}
      AIC_INFERENCE_MODEL_DIMENSION: ${AIC_INFERENCE_MODEL_DIMENSION:-64}
    read_only: true
    tmpfs: [/tmp]

  backend:
    <<: *common
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      INFERENCE_URL: http://inference:8000
      AIC_SUBMISSION_ENABLED: "false"
      AIC_FIXTURE_INDEX_ENABLED: ${AIC_FIXTURE_INDEX_ENABLED:-true}
      FRONTEND_ORIGIN: http://localhost:3000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      inference: { condition: service_started }
    ports: ["127.0.0.1:3001:3000"]

  frontend:
    <<: *common
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
    depends_on: [backend]
    ports: ["127.0.0.1:3000:3000"]

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  aic-internal:
    internal: true
